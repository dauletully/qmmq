<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MobileMenu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .stage { padding: 24px; }
  .frame { width: 390px; height: 780px; overflow: hidden; border-radius: 10px; }
  .frame .q-menu { min-height: 780px; }
  .q-sitehead .q-logo { align-self: center; }
</style>
</head>
<body class="q-root">
<div class="stage">
<div class="frame">
<div class="q-menu q-dark">

    <span class="q-sitehead__spacer"></span>
    <button class="q-iconbtn" type="button" aria-label="Закрыть меню"><svg class="q-icon q-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
  </header>
  <nav class="q-menu__list" aria-label="Разделы">
    <a class="q-menu__item" href="#">Главная<svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
    <a class="q-menu__item" href="#">Об ассоциации<svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
    <a class="q-menu__item is-active" href="#">Мероприятия<svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
    <div class="q-menu__sub"><a href="#">Ближайшие</a><a href="#">Архив</a></div>
    <a class="q-menu__item" href="#">Конкурс учителей<svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
    <a class="q-menu__item" href="#">Сообщество<svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
    <a class="q-menu__item" href="#">Новости и материалы<svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
    <a class="q-menu__item" href="#">Партнёрам<svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
    <a class="q-menu__item" href="#">Контакты<svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
  </nav>
  <div class="q-menu__foot">
    <nav class="q-lang" aria-label="Язык" style="width:fit-content"><a href="#" aria-current="true">RU</a><a href="#">KZ</a></nav>
    <a class="q-btn q-btn--primary q-btn--block" href="#">Вступить в сообщество</a>

</div>
</div>

</html>
