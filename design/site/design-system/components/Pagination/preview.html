<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Pagination</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .stage { padding: 24px; display: flex; flex-direction: column; gap: 32px; align-items: center; }
</style>
</head>
<body class="q-root">
<div class="stage">
  <nav aria-label="Страницы"><ul class="q-pager">
    <li><span class="q-pager__arrow is-disabled" aria-hidden="true"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></span></li>
    <li><a href="#" aria-current="page">1</a></li><li><a href="#">2</a></li><li><a href="#">3</a></li><li><span class="q-pager__gap">…</span></li><li><a href="#">8</a></li>
    <li><a class="q-pager__arrow" href="#" aria-label="Следующая страница"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></li>
  </ul></nav>
  <div class="q-loadmore"><button class="q-btn q-btn--secondary" type="button">Показать ещё 12</button><p class="q-small">Показано 12 из 48</p></div>
</div>
</body>
</html>
