<!-- @dsCard group="Формы" height=672 subtitle="Нижний лист фильтров на 390: группы чипов, счётчик в кнопке" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>FilterSheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .stage { padding: 24px; }
  .frame { position: relative; width: 390px; height: 600px; overflow: hidden; border-radius: 10px; background: var(--surface); }
  .frame .q-sheet { max-height: 540px; }
</style>
</head>
<body class="q-root">
<div class="stage">
<div class="frame">
  <div style="padding:20px;color:var(--ink-muted);font-size:14px">Каталог мероприятий под листом</div>
  <div class="q-scrim"></div>
  <div class="q-sheet" role="dialog" aria-modal="true" aria-labelledby="fs-title">
    <span class="q-sheet__grab"></span>
    <div class="q-sheet__head"><h2 class="q-h3" id="fs-title" style="margin-top:8px">Фильтры</h2><button class="q-iconbtn" type="button" aria-label="Закрыть" style="color:var(--brand)"><svg class="q-icon q-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
    <div class="q-sheet__body">
      <div class="q-fgroup"><span class="q-fgroup__label">Предмет</span><div class="q-chips"><button class="q-chip q-chip--math is-selected" type="button">Математика</button><button class="q-chip q-chip--physics" type="button">Физика</button><button class="q-chip q-chip--informatics" type="button">Информатика</button></div></div>
      <div class="q-fgroup"><span class="q-fgroup__label">Тип</span><div class="q-chips"><button class="q-chip" type="button">Конкурс</button><button class="q-chip" type="button">Олимпиада</button><button class="q-chip" type="button">Семинар</button><button class="q-chip" type="button">Тренинг</button></div></div>
      <div class="q-fgroup"><span class="q-fgroup__label">Формат</span><div class="q-chips"><button class="q-chip is-selected" type="button">Очно</button><button class="q-chip" type="button">Онлайн</button></div></div>
      <div class="q-fgroup"><span class="q-fgroup__label">Уровень</span><div class="q-chips"><button class="q-chip" type="button">Международный</button><button class="q-chip" type="button">Республиканский</button><button class="q-chip" type="button">Областной</button><button class="q-chip" type="button">Городской</button></div></div>
      <div class="q-fgroup"><span class="q-fgroup__label">Регион</span><div class="q-select"><select class="q-input" aria-label="Регион"><option>Все регионы</option></select><svg class="q-icon q-select__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></div></div>
    </div>
    <div class="q-sheet__foot"><button class="q-btn q-btn--secondary" type="button">Сбросить</button><button class="q-btn q-btn--primary q-btn--block" type="button">Показать 24</button></div>
  </div>
</div>
</div>
</body>
</html>
