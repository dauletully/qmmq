<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Subscribe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .q-root.q-d .q-section { padding: 48px 0; }
  .q-root.q-d .q-wrap { padding: 0 48px; }
</style>
</head>
<body class="q-root q-d">
<section class="q-section q-cta q-dark q-grid-bg">
  <div class="q-wrap q-cta__in" style="column-gap:64px">
    <div>
      <p class="q-overline">Рассылка</p>
      <h2 class="q-h2" style="margin-top:16px">Узнавайте о конкурсах первыми</h2>
      <p class="q-lead" style="margin-top:16px">Одно письмо в месяц: открытие регистрации, положения, итоги. Без рекламы.</p>
    </div>
    <form class="q-form" style="gap:12px">
      <div class="q-subscribe"><label class="q-sr" for="sub">E-mail</label><input class="q-input" id="sub" type="email" placeholder="name@example.kz"><button class="q-btn q-btn--primary" type="button">Подписаться</button></div>
      <p class="q-hint">Нажимая «Подписаться», вы соглашаетесь с <a class="q-link" href="#">политикой конфиденциальности</a>.</p>
      <div class="q-social"><a href="#"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>Канал в Telegram</a><a href="#"><svg class="q-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>Канал в WhatsApp</a><a href="#">Instagram</a></div>
    </form>
  </div>
</section>
</body>
</html>
