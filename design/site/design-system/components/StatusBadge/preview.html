<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>StatusBadge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; padding: 20px 24px; align-items: center; }
</style>
</head>
<body class="q-root">
<div class="row">
  <span class="q-status q-status--open">Регистрация до 30 ноября</span>
  <span class="q-status q-status--soon">Анонс</span>
  <span class="q-status q-status--waitlist">Лист ожидания</span>
  <span class="q-status q-status--closed">Регистрация закрыта</span>
  <span class="q-status q-status--past">Итоги · 27 октября 2026</span>
  <span class="q-status q-status--open q-status--lg">Регистрация до 30 ноября</span>
</div>
<div class="row q-dark">
  <span class="q-status q-status--open">Регистрация до 30 ноября</span>
  <span class="q-status q-status--waitlist">Лист ожидания</span>
  <span class="q-status q-status--past">Итоги · 27 октября 2026</span>
</div>
</body>
</html>
